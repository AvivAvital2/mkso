[project]
name = "mkso"
version = "0.1.0"
description = "Proof-carrying requirements, implementation, and evidence graph"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "mkso contributors"}]
dependencies = [
    "protobuf==6.33.2",
    "psycopg[binary]==3.3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[dependency-groups]
verification = [
    "jsonschema[format]==4.26.0",
    "ruff==0.16.4",
    "z3-solver==4.13.3.0",
]

[project.scripts]
mkso = "mkso.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mkso"]
artifacts = [
    "mkso/_schema/scip.proto",
    "mkso/_schema/README.md",
    "mkso/_sql/i06_toolchain_qualification.sql",
]

[tool.uv]
required-version = "==0.12.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# This SCIP producer fixture freezes the exact PEP 695 union member order under qualification.
"verification/fixtures/a05_python/scip_cases/type_aliases.py" = ["RUF036"]
